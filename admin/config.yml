backend:
  name: github
  repo: multiserviciolafranja-ops/multiservicios-la-franja  
  branch: main   
  base_url: https://api.netlify.com   

media_folder: "images/productos"  
public_folder: "/images/productos"

collections:
  - name: "molduras"
    label: "Productos de Molduras"
    folder: "data/molduras"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Código del producto", name: "codigo", widget: "string", required: true }
      - { label: "Nombre", name: "nombre", widget: "string", required: true }
      - { label: "Precio (Q)", name: "precio", widget: "number", value_type: "float", required: true }
      - { label: "Descripción", name: "descripcion", widget: "text", required: false }
      - { label: "Imagen", name: "imagen", widget: "image", required: false }
      - { label: "Destacado", name: "destacado", widget: "boolean", default: false, required: false }
